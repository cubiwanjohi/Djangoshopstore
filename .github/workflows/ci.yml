name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run, so newly published vulnerabilities in dependencies show up.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (the version is in the comment),
# because version tags can be moved. Dependabot keeps these pins up to date.

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shopstore
          POSTGRES_USER: shopstore_user
          POSTGRES_PASSWORD: shopstore_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopstore_user -d shopstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      USE_SQLITE: "False"
      POSTGRES_DB: shopstore
      POSTGRES_USER: shopstore_user
      POSTGRES_PASSWORD: shopstore_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run tests
        run: python manage.py test --verbosity 2

  security:
    name: Dependency and code scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install scanners
        run: python -m pip install pip-audit bandit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Scan the code for risky patterns
        run: bandit -r config store -x store/tests.py,store/test_shop_flow.py,store/migrations -ll

  docker:
    name: Docker build, image scan and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-test-secret-key-not-for-production
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          USE_SQLITE=False
          POSTGRES_DB=shopstore
          POSTGRES_USER=shopstore_user
          POSTGRES_PASSWORD=shopstore_password
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          MPESA_SHORTCODE=174379
          MPESA_BASE_URL=https://sandbox.safaricom.co.ke
          EOF

      - name: Build the image
        run: docker build -t shopstore-web:ci .

      # Pinned to the commit of trivy-action v0.35.0 and Trivy v0.69.3. In March 2026
      # older trivy-action tags were hijacked, so never reference this action by tag.
      - name: Report HIGH and CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: shopstore-web:ci
          version: v0.69.3
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Fail on CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: shopstore-web:ci
          version: v0.69.3
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start the stack
        run: docker compose up -d --build

      - name: Smoke test the running app
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused \
            http://localhost:8000/ > /dev/null
          curl --fail --silent --show-error http://localhost:8000/static/store/style.css > /dev/null
          echo "App and static files respond correctly"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v