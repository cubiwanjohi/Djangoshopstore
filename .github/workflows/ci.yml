```yaml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan for newly published vulnerabilities.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shopstore
          POSTGRES_USER: shopstore_user
          POSTGRES_PASSWORD: shopstore_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopstore_user -d shopstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      USE_SQLITE: "False"
      POSTGRES_DB: shopstore
      POSTGRES_USER: shopstore_user
      POSTGRES_PASSWORD: shopstore_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run tests
        run: python manage.py test --verbosity 2

  security:
    name: Dependency and code scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install scanners
        run: python -m pip install pip-audit bandit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Scan the code for risky patterns
        run: bandit -r config store -x store/tests.py,store/test_shop_flow.py,store/migrations -ll

  docker:
    name: Docker build, image scan and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-test-secret-key-not-for-production
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          USE_SQLITE=False
          POSTGRES_DB=shopstore
          POSTGRES_USER=shopstore_user
          POSTGRES_PASSWORD=shopstore_password
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          MPESA_SHORTCODE=174379
          MPESA_BASE_URL=https://sandbox.safaricom.co.ke
          EOF

      - name: Build the image
        run: docker build -t shopstore-web:ci .

      # Report vulnerabilities without failing the reporting step.
      - name: Report HIGH and CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: shopstore-web:ci
          version: v0.69.3
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # Fail this step if fixable or unfixed CRITICAL vulnerabilities are found.
      - name: Fail on CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: shopstore-web:ci
          version: v0.69.3
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the web container to remain running
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..30}; do
            WEB_ID="$(docker compose ps -q web)"

            if [ -n "$WEB_ID" ]; then
              STATUS="$(docker inspect --format='{{.State.Status}}' "$WEB_ID")"
              RUNNING="$(docker inspect --format='{{.State.Running}}' "$WEB_ID")"

              if [ "$STATUS" = "running" ] && [ "$RUNNING" = "true" ]; then
                echo "Web container is running."
                break
              fi

              if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
                echo "Web container stopped unexpectedly."
                docker compose ps -a
                docker compose logs --no-color --timestamps web
                exit 1
              fi
            fi

            if [ "$i" -eq 30 ]; then
              echo "Web container did not start within 60 seconds."
              docker compose ps -a
              docker compose logs --no-color --timestamps web db
              exit 1
            fi

            sleep 2
          done

      - name: Smoke test the running app
        shell: bash
        run: |
          set -uo pipefail

          BASE_URL="http://localhost:8000"
          HOMEPAGE_OK=false

          echo "Checking the Django homepage..."

          for i in {1..30}; do
            HTTP_CODE="$(curl \
              --connect-timeout 5 \
              --max-time 15 \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$BASE_URL/" 2>/dev/null || true)"

            if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]] || \
               [[ "$HTTP_CODE" =~ ^3[0-9][0-9]$ ]]; then
              echo "Homepage responded with HTTP $HTTP_CODE."
              HOMEPAGE_OK=true
              break
            fi

            echo "Homepage attempt $i returned HTTP '${HTTP_CODE:-no response}'."

            if [ "$i" -lt 30 ]; then
              sleep 2
            fi
          done

          if [ "$HOMEPAGE_OK" != "true" ]; then
            echo "Homepage failed after 30 attempts."
            docker compose ps -a
            docker compose logs --no-color --timestamps web db
            exit 1
          fi

          echo "Checking the CSS file..."

          CSS_CODE="$(curl \
            --connect-timeout 5 \
            --max-time 15 \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' \
            "$BASE_URL/static/store/style.css" 2>/dev/null || true)"

          if [ "$CSS_CODE" != "200" ]; then
            echo "CSS check failed with HTTP '${CSS_CODE:-no response}'."
            docker compose ps -a
            docker compose logs --no-color --timestamps web
            exit 1
          fi

          echo "CSS file responded with HTTP 200."
          echo "App and static-file smoke tests passed."

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "========================================"
          echo "CONTAINER STATUS"
          echo "========================================"
          docker compose ps -a

          echo ""
          echo "========================================"
          echo "DJANGO WEB CONTAINER LOGS"
          echo "========================================"
          docker compose logs --no-color --timestamps web

          echo ""
          echo "========================================"
          echo "POSTGRES DATABASE LOGS"
          echo "========================================"
          docker compose logs --no-color --timestamps db

          echo ""
          echo "========================================"
          echo "WEB CONTAINER STATE"
          echo "========================================"
          WEB_ID="$(docker compose ps -aq web)"
          if [ -n "$WEB_ID" ]; then
            docker inspect "$WEB_ID" \
              --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}}'
          else
            echo "No web container found."
          fi

      - name: Stop the stack
        if: always()
        run: docker compose down
```